name: recursive_reasoning.trm_stochastic@TinyRecursiveReasoningModel_ACTV1
loss:
  name: losses@MCLLossHead
  loss_type: stablemax_cross_entropy
  mean_weight: 0.1

halt_exploration_prob: 0.1
halt_max_steps: 16

H_cycles: 3
L_cycles: 6

H_layers: 0
L_layers: 2

hidden_size: 512
num_heads: 8
expansion: 4

puzzle_emb_ndim: ${.hidden_size}

pos_encodings: rope
forward_dtype: bfloat16

mlp_t: False
puzzle_emb_len: 16
no_ACT_continue: True

n_samples: 4
noise_sigma: 0.1
noise_mode: zL
eval_noise: False
